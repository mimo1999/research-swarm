[project]
name = "research-swarm"
version = "0.1.0"
description = "Multi-Agent Research Swarm"
authors = [
    {name = "Maitreya Mohapatra", email = "maitreyamohapatra18@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    # LlamaIndex RAG
    "llama-index>=0.11.0",
    "llama-index-vector-stores-chroma>=0.3.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-anthropic>=0.4.0",
    "chromadb>=0.5.0",
    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings (>=2.0.0)",
    # Streamlit UI
    "streamlit>=1.37.0",
    # Tools
    "tavily-python>=0.3.0",
    "arxiv>=2.1.0",
    "pypdf>=4.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # Observability
    "langsmith>=0.1.0",
    "structlog>=24.0.0",
    # Persistence
    "aiosqlite>=0.20.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # PDF export
    "markdown>=3.7",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
    "llama-index-embeddings-huggingface (>=0.7.0,<0.8.0)",
    "llama-index-llms-ollama (>=0.10.1,<0.11.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    # torchvision must match the torch build pulled in by sentence-transformers.
    # torch 2.10.x  →  torchvision 0.25.x
    # Required because transformers 5.x includes vision-model processors
    # (yolos, zoedepth) that import torchvision at module-scan time.
    "torchvision (>=0.25.0,<0.26.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "vcrpy>=6.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "vcrpy (>=8.1.1,<9.0.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)"
]
